<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Soft Landing — Provence Africa Connect</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" type="image/png" href="assets/mark.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-400-800-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/roboto-400-latin.woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ───────────────────────── Porte d'entrée ───────────────────────── -->
<div id="gate" class="gate">
  <form class="gate__card" id="gate-form" autocomplete="off">
    <div class="gate__brand">
      <img class="logo" src="assets/logo.png"
           alt="Soft Landing Provence Africa Connect" width="900" height="281">
    </div>

    <label class="eyebrow gate__label" for="gate-password" data-i18n="gate.label">Mot de passe de la promotion</label>
    <input class="field" id="gate-password" type="password" autocomplete="current-password"
           required aria-describedby="gate-error">
    <button class="btn btn--primary btn--lg btn--block" type="submit" data-i18n="gate.submit">Entrer</button>

    <p class="alert" id="gate-error" role="alert" hidden></p>
    <p class="gate__hint" data-i18n="gate.hint">Espace privé réservé aux participants du programme.</p>

    <div class="gate__langs">
      <button type="button" class="langbtn" data-lang="fr">FR</button>
      <button type="button" class="langbtn" data-lang="en">EN</button>
    </div>
  </form>
</div>

<!-- ───────────────────────── Application ───────────────────────── -->
<div id="app" class="app" hidden>

  <aside class="rail">
    <div class="rail__brand">
      <img class="logo" src="assets/logo.png"
           alt="Soft Landing Provence Africa Connect" width="900" height="281">
    </div>

    <button type="button" class="findbtn" id="find-open">
      <span class="findbtn__i"></span>
      <span data-i18n="find.open">Rechercher</span>
      <kbd class="findbtn__k">⌘K</kbd>
    </button>

    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>

    <div class="rail__foot">
      <button type="button" class="btn btn--block" id="edit-toggle" data-i18n="app.edit">Mode édition</button>
      <div class="rail__row">
        <div class="gate__langs">
          <button type="button" class="langbtn" data-lang="fr">FR</button>
          <button type="button" class="langbtn" data-lang="en">EN</button>
        </div>
        <button type="button" class="linkbtn" id="lock" data-i18n="app.lock">Verrouiller</button>
      </div>
      <p class="rail__meta" id="promo"></p>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <p class="topbar__t" id="topbar-title">Soft Landing</p>
      <div class="gate__langs">
        <button type="button" class="langbtn" data-lang="fr">FR</button>
        <button type="button" class="langbtn" data-lang="en">EN</button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="view" id="view-accueil" hidden></section>
      <section class="view" id="view-programme" hidden></section>
      <section class="view" id="view-installation" hidden></section>
      <section class="view" id="view-glossaire" hidden></section>
      <section class="view" id="view-visa" hidden></section>
      <section class="view" id="view-business-plan" hidden></section>
      <section class="view" id="view-interculturel" hidden></section>
      <section class="view" id="view-entreprises" hidden></section>
      <section class="view" id="view-acteurs" hidden></section>
      <section class="view" id="view-hotels" hidden></section>
      <section class="view" id="view-contacts" hidden></section>
      <section class="view" id="view-marseille" hidden></section>
    </main>

    <footer class="foot">
      <span id="foot-updated"></span>
      <span class="foot__dot">·</span>
      <span data-i18n="app.confidential">Document interne — ne pas diffuser</span>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <!-- Recherche globale -->
  <div class="find" id="find" hidden>
    <div class="find__box" role="dialog" aria-modal="true" aria-label="Recherche">
      <div class="find__head">
        <span class="find__headi"></span>
        <input class="find__in" id="find-input" type="search" autocomplete="off"
               placeholder="Chercher partout…" data-i18n-placeholder="find.holder">
        <button type="button" class="iconbtn" id="find-close" aria-label="Fermer">✕</button>
      </div>
      <div class="find__res" id="find-results"></div>
      <p class="find__foot" data-i18n="find.hint">Entrée pour ouvrir · Échap pour fermer</p>
    </div>
  </div>

  <!-- Barre du mode édition -->
  <div class="editbar" id="editbar" hidden>
    <span class="editbar__c" id="editbar-count"></span>
    <span class="editbar__sp"></span>
    <button type="button" class="btn" id="edit-take" hidden data-i18n="save.takeNew">Reprendre la version en ligne</button>
    <button type="button" class="btn" id="edit-cancel" data-i18n="edit.cancel">Tout annuler</button>
    <button type="button" class="btn" id="edit-json" data-i18n="edit.json">content.json</button>
    <button type="button" class="btn btn--accent" id="edit-publish" data-i18n="edit.publish">Publier</button>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
